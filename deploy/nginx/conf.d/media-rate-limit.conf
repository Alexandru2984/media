# Media rate-limit keys and zones. This file is loaded from nginx's http{} scope.
# $remote_addr is the verified visitor address after Cloudflare real-IP handling.

map $request_method $media_write_client {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
    OPTIONS "";
}

map $request_method $media_step_up_client {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
    OPTIONS "";
}

# Legacy links may contain query-string secrets; never forward their full URL.
map $request_uri $media_referrer_policy {
    default strict-origin-when-cross-origin;
    ~^/(reset-password|verify-email|verify-email-change)(/|\?|$) no-referrer;
}

limit_req_zone $binary_remote_addr zone=media_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=media_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=media_search:10m rate=30r/m;
limit_req_zone $media_write_client zone=media_write:10m rate=30r/m;
limit_req_zone $media_write_client zone=media_social_write:10m rate=15r/m;
limit_req_zone $media_step_up_client zone=media_step_up:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=media_upload:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=media_conn:10m;
